allowBuilds:
  esbuild: true
overrides:
  # Fix pnpm audit findings without changing the pinned @effect/vitest 0.30.0
  # and vitest 4.1.11 pair.
  '@vitest/mocker': 4.1.12
  launch-editor: 2.14.2
  shell-quote: 1.11.0
  source-map-js: 1.2.2
  vite: 7.3.7
  # GHSA-2v37-7h3g-55p8: nanoid <3.3.18 custom generators can loop
  # indefinitely when size is zero. Reached transitively through
  # @effect/vitest > vitest > vite > postcss > nanoid (vitest 4.1.11).
  nanoid: '>=3.3.18'
minimumReleaseAgeExclude:
  - '@nerima-games/mc-physics@0.1.0 || 0.1.7 || 0.2.0 || 0.2.1 || 0.2.2 || 0.3.0'
  - '@nerima-games/mc-kernel@0.2.4 || 0.2.5 || 0.2.7 || 0.2.8 || 0.2.9 || 0.2.14 || 0.2.15 || 0.2.16 || 0.5.0 || 0.7.0 || 0.8.0'
  - '@nerima-games/mc-save@0.1.0 || 0.3.0 || 0.4.1 || 0.5.0'
  - '@nerima-games/mc-worldgen@0.1.1 || 0.1.14 || 0.2.0 || 0.3.1 || 0.3.2 || 0.5.0'
  - '@nerima-games/mc-noise@0.2.0 || 0.3.0 || 0.3.1 || 0.4.0'
