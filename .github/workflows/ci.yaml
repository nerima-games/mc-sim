name: CI

on:
  push:
    branches: [main]
  pull_request:

# These are public repositories, so a fork PR runs this workflow. Nothing here
# needs write access, and an unset block inherits an org default that is not
# managed in Terraform.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        # Pinned to a commit, not the mutable v6 tag: a tag can be repointed at
        # new code without any change here (SUPPLY_CHAIN.md).
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # GITHUB_TOKEN is not needed by any later step; do not leave it
          # sitting in .git/config for the rest of the job (SUPPLY_CHAIN.md).
          persist-credentials: false
          # Full history (not the default shallow clone) is needed for the
          # `changeset status --since` comparison below.
          fetch-depth: 0

      - name: Setup pnpm
        # Pinned to a commit, not the mutable v4 tag: this is a third-party action
        # and a tag can be repointed at new code without any change here.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        # --ignore-scripts: pnpm runs postinstall, and a fork PR can edit
        # package.json and the lockfile consistently and still satisfy
        # --frozen-lockfile. Nothing here needs a lifecycle script.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        # Cross-repository dependency boundaries (DEPENDENCY_POLICY.md) are
        # enforced here via .oxlintrc.json's no-restricted-imports, which absorbed
        # the role of the now-removed scripts/check-dependency-whitelist.ts.
        run: pnpm lint

      - name: Changeset status
        # A PR that touches user-facing surface (public API, behaviour,
        # dependencies) must carry a changeset (RELEASE_STANDARD.md §1.2).
        # docs/-only and CI-config-only PRs are exempt.
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qvE '^(docs/|\.github/)'; then
            pnpm exec changeset status --since="origin/${{ github.base_ref }}"
          else
            echo "Only docs/ or .github/ changed; skipping changeset check."
          fi

      - name: Test
        run: pnpm test

      # Coverage gate: statements/branches/functions/lines all >= 99%
      # (TEST_STANDARD.md §3). `vitest run --coverage` itself exits non-zero
      # when a threshold is not met, so no extra assertion script is needed.
      # This is a separate required gate from `pnpm verify` (TEST_STANDARD.md
      # §1) rather than folded into it, to keep `verify` fast.
      - name: Coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage
          path: coverage/
          retention-days: 7
