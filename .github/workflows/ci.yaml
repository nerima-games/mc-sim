name: CI

on:
  push:
    branches: [main]
  pull_request:

# These are public repositories, so a fork PR runs this workflow. Nothing here
# needs write access, and an unset block inherits an org default that is not
# managed in Terraform.
permissions:
  contents: read
  packages: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        # Pinned to a commit, not the mutable v7 tag: a tag can be repointed at
        # new code without any change here (SUPPLY_CHAIN.md).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GITHUB_TOKEN is not needed by any later step; do not leave it
          # sitting in .git/config for the rest of the job (SUPPLY_CHAIN.md).
          persist-credentials: false
          # Full history (not the default shallow clone) is needed for the
          # `changeset status --since` comparison below.
          fetch-depth: 0

      - name: Setup pnpm
        # Pinned to a commit, not the mutable v6 tag: this is a third-party action
        # and a tag can be repointed at new code without any change here.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Configure GitHub Packages authentication
        run: pnpm config set --location=user //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        # --ignore-scripts: pnpm runs postinstall, and a fork PR can edit
        # package.json and the lockfile consistently and still satisfy
        # --frozen-lockfile. Nothing here needs a lifecycle script.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Lint
        # Cross-repository dependency boundaries are enforced by the
        # no-restricted-imports rule in .oxlintrc.json.
        run: pnpm lint

      - name: Changeset status
        # A PR that touches user-facing surface (public API, behaviour,
        # dependencies) must carry a changeset (RELEASE_STANDARD.md §1.2).
        # docs/-only and CI-config-only PRs are exempt.
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qvE '^(docs/|\.github/)'; then
            pnpm exec changeset status --since="origin/${{ github.base_ref }}"
          else
            echo "Only docs/ or .github/ changed; skipping changeset check."
          fi

      - name: Test
        run: pnpm test

      # Coverage gate: statements/branches/functions/lines are all 100%.
      # (TEST_STANDARD.md §3). `vitest run --coverage` itself exits non-zero
      # when a threshold is not met, so no extra assertion script is needed.
      # This is a separate required gate from `pnpm verify` (TEST_STANDARD.md
      # §1) rather than folded into it, to keep `verify` fast.
      - name: Coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 7
